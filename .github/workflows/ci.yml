# CI común. El job `proto` es una comprobación obligatoria en dev y main.
# Cada servicio tiene su job, con un filtro de rutas dentro del job.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: buf breaking compara con la rama base desde .git.
          fetch-depth: 0

      # buf breaking solo tiene sentido si la rama base ya tiene proto/.
      - name: Detectar proto/ en la rama base
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:proto/buf.yaml" 2>/dev/null; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
            echo "La rama base no tiene proto/buf.yaml; se omite buf breaking."
          fi

      # buf build siempre; lint en todo evento; breaking solo en pull requests.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          input: proto
          lint: true
          format: false
          breaking: ${{ steps.base.outputs.has_proto == 'true' }}
          breaking_against: .git#ref=${{ github.event.pull_request.base.sha }},subdir=proto
          push: false
          archive: false
          pr_comment: false

  codegen:
    name: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true

      # Comprueba que la generación funciona; el resultado no se guarda.
      - name: buf generate
        run: buf generate --template proto/buf.gen.yaml

  # Persistencia (Python). El filtro de rutas va dentro del job, no en
  # `on.paths`: sin cambios en sus rutas los pasos se saltan y el job termina
  # en verde, así puede ser una comprobación obligatoria.
  persistence:
    name: persistence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lee los archivos del pull request por la API.
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          # Base desechable del CI; esta clave no protege nada real.
          POSTGRES_USER: hydrovalley
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hydrovalley_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydrovalley -d hydrovalley_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            persistence:
              - 'src/persistence/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

      - name: Sin cambios en la persistencia
        if: steps.changes.outputs.persistence != 'true'
        run: echo "Sin cambios en src/persistence, proto ni el workflow; no hay nada que probar."

      - uses: bufbuild/buf-action@v1
        if: steps.changes.outputs.persistence == 'true'
        with:
          version: 1.73.0
          setup_only: true

      - name: buf generate
        if: steps.changes.outputs.persistence == 'true'
        run: buf generate --template proto/buf.gen.yaml

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.changes.outputs.persistence == 'true'
        with:
          version: 0.12.3
          working-directory: src/persistence

      - name: Instalar dependencias
        if: steps.changes.outputs.persistence == 'true'
        working-directory: src/persistence
        run: uv sync --frozen

      - name: Pruebas unitarias
        if: steps.changes.outputs.persistence == 'true'
        working-directory: src/persistence
        run: uv run pytest -v -m "not integration"

      - name: Pruebas de integración (PostgreSQL 16)
        if: steps.changes.outputs.persistence == 'true'
        working-directory: src/persistence
        env:
          TEST_DATABASE_URL: postgresql://hydrovalley:ci-only@127.0.0.1:5432/hydrovalley_test
        run: uv run pytest -v -m integration

  # Simulador del valle (Rust). Mismo patrón que `persistence`: el filtro de
  # rutas va dentro del job, así que sin cambios termina en verde y puede
  # ser una comprobación obligatoria. build.rs genera el código desde
  # proto/ con un protoc incluido (protoc-bin-vendored): no necesita buf.
  world:
    name: world
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lee los archivos del pull request por la API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            world:
              - 'src/world/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

      - name: Sin cambios en el simulador
        if: steps.changes.outputs.world != 'true'
        run: echo "Sin cambios en src/world, proto ni el workflow; no hay nada que probar."

      - uses: dtolnay/rust-toolchain@master
        if: steps.changes.outputs.world == 'true'
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.world == 'true'
        with:
          workspaces: src/world

      - name: Formato
        if: steps.changes.outputs.world == 'true'
        working-directory: src/world
        run: cargo fmt --check

      - name: Clippy
        if: steps.changes.outputs.world == 'true'
        working-directory: src/world
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Pruebas
        if: steps.changes.outputs.world == 'true'
        working-directory: src/world
        run: cargo test --locked

  # Hub en tiempo real (Go). Mismo patrón que `persistence`: el filtro de
  # rutas va dentro del job, así que sin cambios termina en verde y puede
  # ser una comprobación obligatoria. Usa el código generado en gen/go.
  hub:
    name: hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lee los archivos del pull request por la API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            hub:
              - 'src/hub/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

      - name: Sin cambios en el hub
        if: steps.changes.outputs.hub != 'true'
        run: echo "Sin cambios en src/hub, proto ni el workflow; no hay nada que probar."

      - uses: bufbuild/buf-action@v1
        if: steps.changes.outputs.hub == 'true'
        with:
          version: 1.73.0
          setup_only: true

      # El mismo go.mod que escribe scripts/gen-proto.sh para gen/go.
      - name: buf generate
        if: steps.changes.outputs.hub == 'true'
        run: |
          buf generate --template proto/buf.gen.yaml
          printf 'module github.com/iadev2005/hydrovalley/gen/go\n\ngo 1.24\n' > gen/go/go.mod

      - uses: actions/setup-go@v6
        if: steps.changes.outputs.hub == 'true'
        with:
          go-version-file: src/hub/go.mod
          cache-dependency-path: src/hub/go.sum

      - name: Formato
        if: steps.changes.outputs.hub == 'true'
        working-directory: src/hub
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        if: steps.changes.outputs.hub == 'true'
        working-directory: src/hub
        run: go vet ./...

      - name: staticcheck
        if: steps.changes.outputs.hub == 'true'
        working-directory: src/hub
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Pruebas (con el detector de carreras)
        if: steps.changes.outputs.hub == 'true'
        working-directory: src/hub
        run: go test -race ./...

  # API (TypeScript). Mismo patrón que `persistence`: el filtro de rutas va
  # dentro del job, así que sin cambios termina en verde y puede ser una
  # comprobación obligatoria.
  api:
    name: api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lee los archivos del pull request por la API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            api:
              - 'src/api/**'
              - '.github/workflows/ci.yml'

      - name: Sin cambios en la API
        if: steps.changes.outputs.api != 'true'
        run: echo "Sin cambios en src/api ni el workflow; no hay nada que probar."

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.api == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/api/package-lock.json

      - name: Instalar dependencias
        if: steps.changes.outputs.api == 'true'
        working-directory: src/api
        run: npm ci --ignore-scripts

      - name: ESLint
        if: steps.changes.outputs.api == 'true'
        working-directory: src/api
        run: npm run lint

      - name: Tipos (tsc estricto)
        if: steps.changes.outputs.api == 'true'
        working-directory: src/api
        run: npm run typecheck

      - name: Pruebas
        if: steps.changes.outputs.api == 'true'
        working-directory: src/api
        run: npm test

  # Frontend (módulos ES sin compilación). Solo las pruebas de play.js con
  # node:test; no tiene dependencias.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lee los archivos del pull request por la API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/ci.yml'

      - name: Sin cambios en el frontend
        if: steps.changes.outputs.frontend != 'true'
        run: echo "Sin cambios en src/frontend ni el workflow; no hay nada que probar."

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 22

      - name: Pruebas
        if: steps.changes.outputs.frontend == 'true'
        working-directory: src/frontend
        run: npm test

  # Prueba de humo de punta a punta (CP-01-lite) con el plan B: construye
  # todas las imágenes, levanta deploy/compose.yml y suelta una gota por
  # nginx. Solo en pull requests; tarda varios minutos (sobre todo Rust la
  # primera vez). Las capas se guardan en la caché de GitHub Actions.
  e2e:
    name: e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Solo para interpolar deploy/compose.yml al construir; run.sh usa
      # deploy/.env.example al levantar.
      POSTGRES_USER: hydrovalley
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: hydrovalley
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Construye las imágenes de compose.yml con sus nombres (image:) y las
      # carga en Docker, así `compose up` no vuelve a construir. Bake resuelve
      # el `context: ..` de compose.yml desde el directorio de trabajo, no
      # desde deploy/: se fija la raíz del repositorio a mano.
      - name: Construir las imágenes
        uses: docker/bake-action@v7
        with:
          source: .
          files: deploy/compose.yml
          load: true
          set: |
            *.context=.
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=e2e
            *.cache-to=type=gha,scope=e2e,mode=max

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prueba de humo (tests/e2e/run.sh)
        env:
          E2E_SKIP_BUILD: "1"
        run: tests/e2e/run.sh
