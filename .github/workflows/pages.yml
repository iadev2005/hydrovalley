# Publica la página del proyecto en GitHub Pages al fusionar en main.
# Reúne docs/site, los SVG de PlantUML, el OpenAPI de la API y el informe.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Los .puml no se publican: la galería los enlaza en GitHub.
      - name: Montar _site
        run: |
          mkdir -p _site/diagrams _site/api
          cp -R docs/site/. _site/
          cp docs/diagrams/*.svg _site/diagrams/
          cp docs/api/openapi.json _site/api/openapi.json
          if [ -f docs/informe/informe.pdf ]; then
            cp docs/informe/informe.pdf _site/informe.pdf
          else
            echo "No existe docs/informe/informe.pdf; la página queda sin el informe."
          fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
