ce-line="135"><path d="M692.75,349.897 L692.75,450.694 L1201.244,450.694 L1201.244,359.897 L1191.244,349.897 L692.75,349.897" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1191.244,349.897 L1191.244,359.897 L1201.244,359.897 L1191.244,349.897" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="698.75" y="366.964" fill="#000" font-size="13" textLength="435.125">Se usa mientras no exista la regla del cortafuegos. Solo el 8080 se</text><text x="698.75" y="382.097" fill="#000" font-size="13" textLength="450.366">publica en el host; los servicios se hablan por la red de Compose con</text><text x="698.75" y="397.229" fill="#000" font-size="13" textLength="420.513">el nombre del servicio (p. ej. world:50051), sin cruzar máquinas.</text><text x="698.75" y="412.362" fill="#000" font-size="13" textLength="486.307">Como el cortafuegos bloquea las conexiones entrantes, el navegador y los</text><text x="698.75" y="427.495" fill="#000" font-size="13" textLength="487.494">bots también corren en esta máquina. Es el plan B, no el destino (RES-07);</text><text x="698.75" y="442.628" fill="#000" font-size="13" textLength="469.168">el día de la defensa, el mismo archivo levanta el sistema en una laptop.</text></g><!--link BrowserB to ProxyB--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk12" data-source-line="122" data-link-type="dependency"><path d="M549.01,258.297 C494.21,289.447 414.197,334.935 359.377,366.105" style="stroke:#181818;stroke-width:1;" fill="none" id="BrowserB-to-ProxyB"/><polygon points="355.03,368.577,364.831,367.606,359.377,366.105,360.877,360.651,355.03,368.577" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="585.685" y="300.964" fill="#000" font-size="13" textLength="83.751">HTTPS / WSS</text><text x="497.7" y="316.097" fill="#000" font-size="13" textLength="259.721">localhost:8080 (único puerto publicado)</text></g><!--link BotsB to ProxyB--><g cl