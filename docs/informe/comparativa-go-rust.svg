<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Tiempo por paso del valle: Go frente a Rust</title>
<desc id="d">Mediana de microsegundos por paso según el tamaño del valle. Rust: 32×32 11,7 µs, 64×64 54,6 µs, 128×128 249 µs, 256×256 1,3 ms, 512×512 6,3 ms; Go: 32×32 8,6 µs, 64×64 41,6 µs, 128×128 197 µs, 256×256 1,0 ms, 512×512 4,6 ms.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--rust:#2a78d6;--go:#eb6834}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--rust:#3987e5;--go:#d95926}}
.t{fill:var(--ink)}.t2{fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.ax{stroke:var(--ink2);stroke-width:1}.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p95{stroke-dasharray:6 4}.rust{stroke:var(--rust)}.go{stroke:var(--go)}.mrust{fill:var(--rust)}.mgo{fill:var(--go)}.ring{stroke:var(--surface);stroke-width:2}
</style>
<rect width="860" height="520" fill="var(--surface)"/>
<text class="t" x="78" y="30" font-size="17" font-weight="600">Tiempo de un paso del valle, Go frente a Rust</text>
<text class="t2" x="78" y="50" font-size="12">Microsegundos por paso (<tspan font-family="monospace">World::step</tspan> / <tspan font-family="monospace">World.Step</tspan>), mediana de 3 ejecuciones; menor es mejor</text>
<text class="t2" x="78" y="67" font-size="12">Máquina: Apple M4 (10 núcleos, 16 GB), macOS 26.5.2, arm64</text>
<line class="ln rust" x1="78" y1="86" x2="104" y2="86"/>
<text class="t2" x="110" y="90" font-size="12">Rust, mediana</text>
<line class="ln rust p95" x1="208" y1="86" x2="234" y2="86"/>
<text class="t2" x="240" y="90" font-size="12">Rust, p95</text>
<line class="ln go" x1="338" y1="86" x2="364" y2="86"/>
<text class="t2" x="370" y="90" font-size="12">Go, mediana</text>
<line class="ln go p95" x1="468" y1="86" x2="494" y2="86"/>
<text class="t2" x="500" y="90" font-size="12">Go, p95</text>
<line class="g" x1="78" y1="440.0" x2="710" y2="440.0"/>
<text class="t2" x="70" y="444.0" font-size="11" text-anchor="end">1,0 µs</text>
<line class="g" x1="78" y1="354.0" x2="710" y2="354.0"/>
<text class="t2" x="70" y="358.0" font-size="11" text-anchor="end">10,0 µs</text>
<line class="g" x1="78" y1="268.0" x2="710" y2="268.0"/>
<text class="t2" x="70" y="272.0" font-size="11" text-anchor="end">100 µs</text>
<line class="g" x1="78" y1="182.0" x2="710" y2="182.0"/>
<text class="t2" x="70" y="186.0" font-size="11" text-anchor="end">1,0 ms</text>
<line class="g" x1="78" y1="96.0" x2="710" y2="96.0"/>
<text class="t2" x="70" y="100.0" font-size="11" text-anchor="end">10,0 ms</text>
<line class="g" x1="78.0" y1="96" x2="78.0" y2="440"/>
<text class="t2" x="78.0" y="458" font-size="11" text-anchor="middle">32×32</text>
<text class="t2" x="78.0" y="472" font-size="11" text-anchor="middle">1.024</text>
<line class="g" x1="236.0" y1="96" x2="236.0" y2="440"/>
<text class="t2" x="236.0" y="458" font-size="11" text-anchor="middle">64×64</text>
<text class="t2" x="236.0" y="472" font-size="11" text-anchor="middle">4.096</text>
<line class="g" x1="394.0" y1="96" x2="394.0" y2="440"/>
<text class="t2" x="394.0" y="458" font-size="11" text-anchor="middle">128×128</text>
<text class="t2" x="394.0" y="472" font-size="11" text-anchor="middle">16.384</text>
<line class="g" x1="552.0" y1="96" x2="552.0" y2="440"/>
<text class="t2" x="552.0" y="458" font-size="11" text-anchor="middle">256×256</text>
<text class="t2" x="552.0" y="472" font-size="11" text-anchor="middle">65.536</text>
<line class="g" x1="710.0" y1="96" x2="710.0" y2="440"/>
<text class="t2" x="710.0" y="458" font-size="11" text-anchor="middle">512×512</text>
<text class="t2" x="710.0" y="472" font-size="11" text-anchor="middle">262.144</text>
<line class="ax" x1="78" y1="440" x2="710" y2="440"/>
<text class="t2" x="394" y="504" font-size="12" text-anchor="middle">Tamaño del valle (casillas; ejes logarítmicos). El del juego es 32×32.</text>
<polyline class="ln rust p95" points="78.0,333.6 236.0,277.2 394.0,221.1 552.0,161.7 710.0,103.9"/>
<polyline class="ln rust" points="78.0,348.2 236.0,290.6 394.0,234.0 552.0,171.9 710.0,113.1"/>
<polyline class="ln go p95" points="78.0,346.5 236.0,291.5 394.0,232.8 552.0,173.9 710.0,118.4"/>
