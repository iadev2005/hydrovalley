<circle class="mrust ring" cx="78.0" cy="348.2" r="4.5"/>
<circle class="mrust ring" cx="236.0" cy="290.6" r="4.5"/>
<circle class="mrust ring" cx="394.0" cy="234.0" r="4.5"/>
<circle class="mrust ring" cx="552.0" cy="171.9" r="4.5"/>
<circle class="mrust ring" cx="710.0" cy="113.1" r="4.5"/>
<circle class="mgo ring" cx="78.0" cy="359.5" r="4.5"/>
<circle class="mgo ring" cx="236.0" cy="300.7" r="4.5"/>
