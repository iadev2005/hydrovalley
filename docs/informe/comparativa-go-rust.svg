<circle class="mgo ring" cx="552.0" cy="182.0" r="4.5"/>
<circle class="mgo ring" cx="710.0" cy="124.9" r="4.5"/>
<text class="t" x="720" y="117.1" font-size="12" font-weight="600">Rust 6,3 ms</text>
<text class="t" x="720" y="132.1" font-size="12" font-weight="600">Go 4,6 ms</text>
