<rect x="30" y="1140" width="510" height="118" rx="6" fill="#fffbe6" stroke="#b9a44c" stroke-width="1.4"/>
<text x="42" y="1159" font-size="12.5" text-anchor="start" class="b">Nota general</text>
<text x="42" y="1176" font-size="12.5" text-anchor="start">En Rust esto son structs y enums, no clases: el diagrama muestra datos y</text>
<text x="42" y="1193" font-size="12.5" text-anchor="start">relaciones, no métodos. Todo esto viaja en la instantánea, que Rust copia y envía</text>
<text x="42" y="1210" font-size="12.5" text-anchor="start">en segundo plano cuando tick % 50 == 0 (cada 50 ticks, 5 s), incluido el estado del</text>
<text x="42" y="1227" font-size="12.5" text-anchor="start">generador de azar y los action_id recientes por jugador (últimos 600 ticks).</text>
<text x="42" y="1244" font-size="12.5" text-anchor="start">Agua, hojas y humedad: enteros de 64 bits sin signo.</text>
<rect x="30" y="1272" width="510" height="67" rx="6" fill="#fffbe6" stroke="#b9a44c" stroke-width="1.4"/>
<text x="42" y="1291" font-size="12.5" text-anchor="start" class="b">Comando</text>
<text x="42" y="1308" font-size="12.5" text-anchor="start">Llega en WorldService.Step. No se guarda: solo su action_id queda en</text>
<text x="42" y="1325" font-size="12.5" text-anchor="start">recent_actions.</text>
<rect x="545" y="1140" width="510" height="118" rx="6" fill="#fffbe6" stroke="#b9a44c" stroke-width="1.4"/>
<text x="557" y="1159" font-size="12.5" text-anchor="start" class="b">Jugador</text>
<text x="557" y="1176" font-size="12.5" text-anchor="start">RF-27: water = water_refilled − water_spent y leaves = leaves_earned −</text>
<text x="557" y="1193" font-size="12.5" text-anchor="start">leaves_spent. Ranking (RF-10): leaves_earned. purchases_by_kind fija el precio</text>
<text x="557" y="1210" font-size="12.5" text-anchor="start">(+5 % por compra). 3R acumuladas (reportes): water_reduced (goteo),</text>
<text x="557" y="1227" font-size="12.5" text-anchor="start">water_reused (aspersores), water_recycled (planta). Si una instalación hace</text>
<text x="557" y="1244" font-size="12.5" text-anchor="start">crecer una casilla, las hojas son para su dueño (owner_id).</text>
<rect x="545" y="1272" width="510" height="118" rx="6" fill="#fffbe6" stroke="#b9a44c" stroke-width="1.4"/>
<text x="557" y="1291" font-size="12.5" text-anchor="start" class="b">ResumenOffline</text>
<text x="557" y="1308" font-size="12.5" text-anchor="start">Resumen al volver (RF-25, nivel 2): lo que hicieron los aspersores del jugador</text>
<text x="557" y="1325" font-size="12.5" text-anchor="start">desde su última acción aplicada. Se borra con su siguiente acción aplicada; el</text>
<text x="557" y="1342" font-size="12.5" text-anchor="start">goteo y la planta no aportan. Va en la instantánea solo si no está vacío.</text>
<text x="557" y="1359" font-size="12.5" text-anchor="start">fires_extinguished y tiles_grown de Jugador son el acumulado de la época</text>
<text x="557" y="1376" font-size="12.5" text-anchor="start">(reportes).</text>
<rect x="1060" y="1140" width="510" height="135" rx="6" fill="#fffbe6" stroke="#b9a44c" stroke-width="1.4"/>
<text x="1072" y="1159" font-size="12.5" text-anchor="start" class="b">Casilla (nivel 2)</text>
<text x="1072" y="1176" font-size="12.5" text-anchor="start">Expansión de jugabilidad: Water y Rock son terreno natural que el simulador</text>
<text x="1072" y="1193" font-size="12.5" text-anchor="start">sortea con el generador con semilla al crear el valle (el reinicio lo conserva);</text>
<text x="1072" y="1210" font-size="12.5" text-anchor="start">no crecen, no admiten gotas ni instalaciones. has_building y trash_level van en la</text>
<text x="1072" y="1227" font-size="12.5" text-anchor="start">instantánea solo si no son los valores por defecto. Una casilla con edificio o</text>
<text x="1072" y="1244" font-size="12.5" text-anchor="start">basura no crece ni arde. Cada instalación lleva su durabilidad restante (30 al</text>
<text x="1072" y="1261" font-size="12.5" text-anchor="start">colocarla) y se destruye al llegar a cero.</text>
