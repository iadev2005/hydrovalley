<text x="1042" y="509" font-size="12.5" text-anchor="start" class="b">Cómo se relacionan fuego y crecimiento</text>
<text x="1042" y="526" font-size="12.5" text-anchor="start">Mientras arde, el crecimiento queda congelado (guarda [sin fuego]); las gotas</text>
<text x="1042" y="543" font-size="12.5" text-anchor="start">siguen sumando a la humedad aportada y cuentan para apagarlo.</text>
<text x="1042" y="560" font-size="12.5" text-anchor="start">El fuego siempre se resuelve: tercera gota, aspersor o se consume a los 300</text>
<text x="1042" y="577" font-size="12.5" text-anchor="start">ticks.</text>
<text x="1042" y="594" font-size="12.5" text-anchor="start">Punto de contacto (en rojo): si el fuego se consume antes de que lo apaguen,</text>
<text x="1042" y="611" font-size="12.5" text-anchor="start">dispara en la región de crecimiento el paso a Tierra seca, desde cualquier</text>
<text x="1042" y="628" font-size="12.5" text-anchor="start">etapa.</text>
