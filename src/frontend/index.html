<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hydrovalley</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Página mínima del esqueleto. TODO: React (paneles) y Phaser (valle isométrico). -->
    <main>
      <h1>hydrovalley</h1>
      <section id="access-panel" aria-labelledby="access-title">
        <h2 id="access-title">Acceso</h2>
        <form id="auth-form" autocomplete="on">
          <label>Usuario <input id="username" name="username" type="text" autocomplete="username" required /></label>
          <label>Contraseña <input id="password" name="password" type="password" autocomplete="current-password" required /></label>
          <button id="register" type="button">Registrarse</button>
          <button id="login" type="submit">Entrar</button>
        </form>
        <p id="auth-error" class="error" role="alert" hidden></p>
      </section>
      <section id="session-panel" hidden>
        <p class="meta">
          Conectado como <strong id="session-user"></strong>
          <button id="logout" type="button">Salir</button>
        </p>
      </section>
      <p class="meta">Conexión: <span id="conn">desconectado</span></p>
      <p class="meta" id="state">Sin estado todavía.</p>
      <form id="drop-form">
        <label>x <input id="x" type="number" min="0" step="1" required /></label>
        <label>y <input id="y" type="number" min="0" step="1" required /></label>
        <button id="drop" type="submit" disabled>Soltar gota</button>
      </form>
      <h2>Registro</h2>
      <ol id="log" reversed></ol>
    </main>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
